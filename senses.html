<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple No.129 — Taste &amp; Scent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&family=Pathway+Extreme:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1210; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#ffffff;}
  body{
    font-family:'Pathway Extreme',sans-serif;color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:28px 7vw 0;
  }
  .back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;opacity:0.8;cursor:pointer;}
  .back:hover{opacity:1;}
  .brandmark{font-family:'Notable',sans-serif;font-size:18px;letter-spacing:0.02em;opacity:0.85;}
  .kicker{text-align:center;font-weight:800;font-size:clamp(14px,1.8vw,20px);text-transform:uppercase;letter-spacing:0.03em;opacity:0.85;margin-top:4px;}
  .hint{text-align:center;font-size:clamp(11px,1.2vw,14px);opacity:0.55;margin-top:4px;}

  .layout{
    flex:1;display:flex;align-items:center;justify-content:center;gap:0;
    padding:20px 6vw 10px;flex-wrap:wrap;
  }
  .apple-side{
    flex:1;min-width:260px;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .apple-frame{
    position:relative;overflow:hidden;
    width:min(360px,80vw);aspect-ratio:1;border-radius:20px;
    background:radial-gradient(circle at 50% 35%, #fbf6f3, #f1e9e5 80%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 34px rgba(0,0,0,0.08);
  }
  .apple-frame img{max-width:78%;max-height:78%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,0.18));}
  .apple-frame .empty{font-size:12.5px;color:#a89c93;text-align:center;padding:20px;}
  .mist-puff{
    position:absolute;left:50%;top:50%;width:16px;height:16px;border-radius:50%;
    pointer-events:none;margin-left:-8px;margin-top:-8px;
    animation:puffOut 0.75s ease-out forwards;
  }
  @keyframes puffOut{
    0%{ transform:translate(0,0) scale(0.3); opacity:0.85; }
    100%{ transform:translate(var(--dx), var(--dy)) scale(2.4); opacity:0; }
  }

  .controls-side{
    flex:1;min-width:300px;max-width:440px;display:flex;flex-direction:column;gap:30px;padding:20px;
  }
  .control-block{display:flex;flex-direction:column;gap:10px;}
  .control-label{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.65;}

  .slider-wrap{position:relative;padding-top:6px;}
  .std-band{
    position:absolute;top:6px;height:8px;border-radius:4px;
    background:rgba(200,16,46,0.18);pointer-events:none;
  }
  input[type="range"]{
    -webkit-appearance:none;appearance:none;width:100%;height:8px;
    border-radius:4px;background:#eee3dd;outline:none;position:relative;z-index:1;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:#c8102e;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:#c8102e;border:3px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.3);cursor:pointer;
  }
  .slider-readout{display:flex;justify-content:space-between;font-size:12px;opacity:0.55;margin-top:2px;}
  .slider-value{font-family:'Pathway Extreme',sans-serif;font-weight:800;font-size:18px;opacity:1;}

  .scent-row{display:flex;gap:8px;flex-wrap:wrap;}
  .scent-btn, .bite-btn{
    flex:1;min-width:110px;
    font-family:'Pathway Extreme',sans-serif;font-weight:700;font-size:12px;
    color:var(--ink);background:rgba(0,0,0,0.035);border:1.5px solid rgba(0,0,0,0.15);
    border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;
  }
  .scent-btn.active, .bite-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .note{font-size:12.5px;line-height:1.55;opacity:0.7;min-height:54px;}

  .bottom{display:flex;justify-content:center;padding:4px 0 30px;}
  .nextBtn{
    font-family:'Notable',sans-serif;font-weight:400;font-size:15px;color:#fff;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;padding:0.55em 1.4em 0.65em;cursor:pointer;
    box-shadow:0 8px 18px rgba(60,10,10,0.25), inset 0 2px 4px rgba(255,255,255,0.35);
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
  }

  #debugErr{
    position:fixed;top:90px;left:5vw;right:5vw;z-index:50;font:11px monospace;color:#b00020;
    background:rgba(255,255,255,0.95);border:1px solid #b00020;border-radius:8px;padding:8px;
    display:none;white-space:pre-wrap;max-height:30vh;overflow:auto;
  }

  .bg-apples{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-apple{
    position:absolute;line-height:1;filter:grayscale(0.15);
    animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; }
    50%{ opacity:var(--peak,0.18); }
  }
  body > *:not(.bg-apples){ position:relative; z-index:1; }
</style>
</head>
<body>
<div class="bg-apples" id="bgApples"></div>
<div id="debugErr"></div>

<div class="topbar">
  <a class="back" id="backLink">&larr; BACK</a>
  <div class="brandmark">APPLE NO.129</div>
</div>
<div class="kicker">Taste &amp; scent</div>
<div class="hint">Shape isn't the only thing that gets standardised.</div>

<div class="layout">
  <div class="apple-side">
    <div class="apple-frame" id="appleFrame">
      <div class="empty">No apple found &mdash; go back and shape or draw one first.</div>
    </div>
  </div>

  <div class="controls-side">
    <div class="control-block">
      <div class="control-label">Sweetness</div>
      <div class="slider-wrap">
        <div class="std-band" id="stdBand"></div>
        <input type="range" id="brixSlider" min="6" max="18" step="0.1" value="11">
      </div>
      <div class="slider-readout">
        <span>Tart</span>
        <span class="slider-value"><span id="brixValue">11.0</span>&deg;Brix</span>
        <span>Very sweet</span>
      </div>
      <div class="note" id="brixNote"></div>
    </div>

    <div class="control-block">
      <div class="control-label">Scent &mdash; spray one on</div>
      <div class="scent-row">
        <button class="scent-btn" data-scent="floral">Floral &amp; fresh</button>
        <button class="scent-btn" data-scent="honeyed">Honeyed</button>
        <button class="scent-btn" data-scent="green">Green &amp; tart</button>
        <button class="scent-btn active" data-scent="faint">Faint</button>
      </div>
      <div class="note" id="scentNote"></div>
    </div>

    <div class="control-block">
      <div class="control-label">Crispness &mdash; take a bite</div>
      <div class="scent-row">
        <button class="bite-btn" data-bite="mealy">Mealy</button>
        <button class="bite-btn active" data-bite="medium">Medium</button>
        <button class="bite-btn" data-bite="crisp">Crisp</button>
      </div>
      <div class="note" id="biteNote"></div>
    </div>
  </div>
</div>

<div class="bottom">
  <button class="nextBtn" id="nextBtn">NEXT STEP &rarr;</button>
</div>

<script>
function showErr(msg){
  const el = document.getElementById('debugErr');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', e=> showErr('Error: ' + e.message));

/* ---------- slow twinkling background apples ---------- */
(function(){
  const host = document.getElementById('bgApples');
  const COUNT = 11;
  for(let i=0;i<COUNT;i++){
    const span = document.createElement('span');
    span.className = 'bg-apple';
    span.textContent = '\u{1F34E}';
    const size = 90 + Math.random()*170; // 90px - 260px, much bigger than the 40px card icon
    span.style.fontSize = size + 'px';
    span.style.left = (Math.random()*90) + 'vw';
    span.style.top = (Math.random()*90) + 'vh';
    span.style.setProperty('--peak', (0.1 + Math.random()*0.16).toFixed(2));
    const duration = 8 + Math.random()*10; // slow: 8s-18s per cycle
    span.style.animationDuration = duration + 's';
    span.style.animationDelay = (-Math.random()*duration) + 's'; // desync so they don't pulse together
    host.appendChild(span);
  }
})();

document.getElementById('backLink').addEventListener('click', ()=>{
  if(document.referrer){ history.back(); } else { window.location.href = 'choice.html'; }
});

/* ---------- apple image ---------- */
try{
  const artwork = localStorage.getItem('apple129_artwork');
  if(artwork){
    const frame = document.getElementById('appleFrame');
    frame.innerHTML = '';
    const img = document.createElement('img');
    img.src = artwork;
    frame.appendChild(img);
  }
}catch(err){ showErr('could not load apple image: ' + err.message); }

/* ---------- sweetness: real commercial apples average ~12 degBrix,       */
/* with one published grading spec using 12.6 as a minimum threshold       */
const STD_MIN = 12, STD_MAX = 12.6, SCALE_MIN = 6, SCALE_MAX = 18;
const stdBand = document.getElementById('stdBand');
stdBand.style.left = ((STD_MIN-SCALE_MIN)/(SCALE_MAX-SCALE_MIN)*100) + '%';
stdBand.style.width = ((STD_MAX-STD_MIN)/(SCALE_MAX-SCALE_MIN)*100) + '%';

const brixSlider = document.getElementById('brixSlider');
const brixValue = document.getElementById('brixValue');
const brixNote = document.getElementById('brixNote');

function updateBrixNote(v){
  if(v < 9){
    brixNote.textContent = "Real apples this tart rarely make it to a shelf.";
  } else if(v < STD_MIN){
    brixNote.textContent = "Slightly tart — close to what you'd find in a shop, but on the sharper side.";
  } else if(v <= STD_MAX){
    brixNote.textContent = "This is almost exactly what a supermarket apple measures.";
  } else if(v <= 15){
    brixNote.textContent = "Slightly sweeter than most apples on a shelf.";
  } else {
    brixNote.textContent = "Few commercial apples are bred this sweet.";
  }
}
function renderBrix(){
  const v = parseFloat(brixSlider.value);
  brixValue.textContent = v.toFixed(1);
  updateBrixNote(v);
}
brixSlider.addEventListener('input', renderBrix);
renderBrix();

/* ---------- scent ---------- */
const SCENT_NOTES = {
  floral: "Bright and perfumed — the kind of aroma modern breeding rarely prioritises anymore.",
  honeyed: "Warm and sweet-smelling — less common in the varieties bred for mass distribution.",
  green: "Sharp and grassy — closer to older, less uniform apple varieties.",
  faint: "This is closest to today's apple: scent is one of the first traits lost when a variety is bred for storage and transport instead of flavour."
};
const SCENT_TINTS = {
  floral: 'rgba(240,170,200,0.85)',
  honeyed: 'rgba(235,190,110,0.85)',
  green: 'rgba(150,200,130,0.85)',
  faint: 'rgba(210,205,200,0.6)'
};

const spraySound = new Audio("data:audio/mpeg;base64," + SPRAY_AUDIO_B64);
spraySound.preload = "auto";

function playSpraySound(){
  try{
    spraySound.currentTime = 0;
    spraySound.play().catch(err=> showErr('spray sound play blocked: ' + err.message));
  }catch(err){ showErr('spray sound failed: ' + err.message); }
}

function sprayMist(scent){
  const frame = document.getElementById('appleFrame');
  const color = SCENT_TINTS[scent] || SCENT_TINTS.faint;
  const count = 10;
  for(let i=0;i<count;i++){
    const puff = document.createElement('div');
    puff.className = 'mist-puff';
    const angle = Math.random()*Math.PI*2;
    const dist = 40 + Math.random()*70;
    puff.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    puff.style.setProperty('--dy', (Math.sin(angle)*dist - 20)+'px');
    puff.style.background = `radial-gradient(circle, ${color}, rgba(255,255,255,0))`;
    puff.style.animationDelay = (Math.random()*0.12)+'s';
    frame.appendChild(puff);
    puff.addEventListener('animationend', ()=> puff.remove());
  }
}

document.querySelectorAll('.scent-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.scent-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('scentNote').textContent = SCENT_NOTES[btn.dataset.scent];
    sprayMist(btn.dataset.scent);
    playSpraySound();
  });
});
document.getElementById('scentNote').textContent = SCENT_NOTES.faint;

const biteSounds = {};
Object.keys(BITE_AUDIO_B64).forEach(key=>{
  biteSounds[key] = new Audio("data:audio/mpeg;base64," + BITE_AUDIO_B64[key]);
  biteSounds[key].preload = "auto";
});

document.querySelectorAll('[data-bite]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('[data-bite]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const key = btn.dataset.bite;
    document.getElementById('biteNote').textContent = BITE_NOTES[key];
    try{
      const snd = biteSounds[key];
      snd.currentTime = 0;
      snd.play().catch(err=> showErr('bite sound play blocked: ' + err.message));
    }catch(err){ showErr('bite sound failed: ' + err.message); }
  });
});
document.getElementById('biteNote').textContent = BITE_NOTES.medium;

});

  var audioCtx = null, audioBuffer = null, bufferReady = false;
  var fallbackAudio = null;

  function b64ToArrayBuffer(b64str){
    var binary = atob(b64str);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
    return bytes.buffer;
  }

  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.decodeAudioData(b64ToArrayBuffer(CLICK_SOUND_B64), function(buf){
      audioBuffer = buf;
      bufferReady = true;
    }, function(){});
  }catch(e){}

  function playUiClickSound(){
    try{
      if(audioCtx && bufferReady){
        if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
        var src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;
        var gain = audioCtx.createGain();
        gain.gain.value = 0.55;
        src.connect(gain).connect(audioCtx.destination);
        src.start(0);
      } else {
        if(!fallbackAudio){ fallbackAudio = new Audio('data:audio/mp3;base64,' + CLICK_SOUND_B64); }
        var a = fallbackAudio.cloneNode(true);
        a.volume = 0.55;
        a.play().catch(function(){});
      }
    }catch(e){}
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('button, a');
    if(!el) return;
    if(el.classList.contains('scent-btn') || el.classList.contains('bite-btn')) return;
    if(el.dataset && el.dataset.noClickSound) return;
    playUiClickSound();
  }, true);
})();
