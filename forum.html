<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple No.129 — The Orchard Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&family=Pathway+Extreme:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1210; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#ffffff;}
  body{font-family:'Pathway Extreme',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}

  .bg-apples{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-apple{
    position:absolute;line-height:1;filter:grayscale(0.15);
    animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; }
    50%{ opacity:var(--peak,0.18); }
  }
  body > *:not(.bg-apples){ position:relative; z-index:1; }

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 5vw 0;}
  .back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;opacity:0.8;cursor:pointer;}
  .back:hover{opacity:1;}
  .brandmark{font-family:'Notable',sans-serif;font-size:18px;letter-spacing:0.02em;opacity:0.85;}
  .kicker{text-align:center;font-weight:800;font-size:clamp(14px,1.8vw,20px);text-transform:uppercase;letter-spacing:0.03em;opacity:0.85;margin-top:4px;}
  .title{text-align:center;font-family:'Notable',sans-serif;font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:6px 0 0;}
  .disclaimer{max-width:560px;margin:8px auto 0;text-align:center;font-size:11.5px;line-height:1.6;opacity:0.5;font-style:italic;padding:0 6vw;}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 5vw 60px;gap:34px;}

  .composer{
    width:min(520px,92vw);background:#fff;border:1.5px solid rgba(0,0,0,0.1);border-radius:18px;
    padding:20px;box-shadow:0 14px 34px rgba(0,0,0,0.08);display:flex;flex-direction:column;gap:14px;
  }
  .composer-head{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;opacity:0.6;}
  .composer-preview{width:100%;border-radius:10px;border:1px solid rgba(0,0,0,0.08);display:block;}
  .composer textarea{
    width:100%;min-height:70px;resize:vertical;font-family:'Pathway Extreme',sans-serif;font-size:14px;
    border:1.5px solid rgba(0,0,0,0.15);border-radius:10px;padding:10px 12px;color:var(--ink);
  }
  .publishBtn{
    font-family:'Notable',sans-serif;font-weight:400;font-size:14px;color:#fff;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;padding:0.6em 1.5em 0.7em;cursor:pointer;align-self:center;
    box-shadow:0 8px 18px rgba(60,10,10,0.25), inset 0 2px 4px rgba(255,255,255,0.35);
  }
  .publishBtn:active{transform:translateY(1px);}

  .feed{width:min(640px,92vw);display:flex;flex-direction:column;gap:22px;}
  .feed-empty{text-align:center;font-size:13px;opacity:0.5;padding:30px 0;}
  .post{
    background:#fff;border:1.5px solid rgba(0,0,0,0.08);border-radius:16px;overflow:hidden;
    box-shadow:0 10px 24px rgba(0,0,0,0.06);
  }
  .post img{width:100%;display:block;}
  .post-body{padding:14px 18px 16px;}
  .post-byline{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#b23a3a;margin-bottom:6px;}
  .post-message{font-size:13.5px;line-height:1.6;}
  .post-time{font-size:10.5px;opacity:0.4;margin-top:8px;}

  #debugErr{
    position:fixed;top:90px;left:5vw;right:5vw;z-index:50;font:11px monospace;color:#b00020;
    background:rgba(255,255,255,0.95);border:1px solid #b00020;border-radius:8px;padding:8px;
    display:none;white-space:pre-wrap;max-height:30vh;overflow:auto;
  }
</style>
</head>
<body>
<div class="bg-apples" id="bgApples"></div>
<div id="debugErr"></div>

<div class="topbar">
  <a class="back" id="backLink">&larr; BACK</a>
  <div class="brandmark">APPLE NO.129</div>
</div>
<div class="kicker">Community</div>
<div class="title">The Orchard Board</div>
<div class="disclaimer">For now, posts are saved only on this device/browser — this is a working preview of the board. A shared version everyone can see will follow.</div>

<div class="stage">
  <div class="composer" id="composer" style="display:none;">
    <div class="composer-head">Share your postcard</div>
    <img class="composer-preview" id="composerPreview">
    <textarea id="composerText" maxlength="280" placeholder="Say something about your apple..."></textarea>
    <button class="publishBtn" id="publishBtn">PUBLISH &rarr;</button>
  </div>

  <div class="feed" id="feed"></div>
</div>

<script>
function showErr(msg){
  const el = document.getElementById('debugErr');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', e=> showErr('Error: ' + e.message));

(function(){
  const host = document.getElementById('bgApples');
  const COUNT = 11;
  for(let i=0;i<COUNT;i++){
    const span = document.createElement('span');
    span.className = 'bg-apple';
    span.textContent = '\u{1F34E}';
    const size = 90 + Math.random()*170;
    span.style.fontSize = size + 'px';
    span.style.left = (Math.random()*90) + 'vw';
    span.style.top = (Math.random()*90) + 'vh';
    span.style.setProperty('--peak', (0.1 + Math.random()*0.16).toFixed(2));
    const duration = 8 + Math.random()*10;
    span.style.animationDuration = duration + 's';
    span.style.animationDelay = (-Math.random()*duration) + 's';
    host.appendChild(span);
  }
})();

document.getElementById('backLink').addEventListener('click', ()=>{
  if(document.referrer){ history.back(); } else { window.location.href = 'journey.html'; }
});

let userName = 'You', appleName = 'your apple';
try{
  userName = localStorage.getItem('apple129_username') || userName;
  appleName = localStorage.getItem('apple129_applename') || appleName;
}catch(e){}

const MAX_POSTS = 40;

function loadPosts(){
  try{ return JSON.parse(localStorage.getItem('apple129_forum_posts') || '[]'); }
  catch(e){ return []; }
}
function savePosts(posts){
  try{ localStorage.setItem('apple129_forum_posts', JSON.stringify(posts.slice(0, MAX_POSTS))); }
  catch(e){ showErr('could not save post: ' + e.message); }
}

function timeAgo(ts){
  const diff = Math.max(0, Date.now() - ts);
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}

function renderFeed(){
  const posts = loadPosts();
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = '';
  if(posts.length === 0){
    feedEl.innerHTML = '<div class="feed-empty">No postcards shared yet &mdash; be the first.</div>';
    return;
  }
  posts.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'post';
    card.innerHTML =
      '<img src="' + p.image + '" alt="">' +
      '<div class="post-body">' +
        '<div class="post-byline">' + p.userName + ' · apple ' + p.appleName + '</div>' +
        '<div class="post-message"></div>' +
        '<div class="post-time">' + timeAgo(p.ts) + '</div>' +
      '</div>';
    card.querySelector('.post-message').textContent = p.message || '';
    feedEl.appendChild(card);
  });
}

let draft = null;
try{ draft = localStorage.getItem('apple129_share_draft'); }catch(e){}

if(draft){
  document.getElementById('composer').style.display = 'flex';
  document.getElementById('composerPreview').src = draft;

  document.getElementById('publishBtn').addEventListener('click', ()=>{
    const message = document.getElementById('composerText').value.trim();
    const posts = loadPosts();
    posts.unshift({
      image: draft,
      message: message,
      userName: userName,
      appleName: appleName,
      ts: Date.now()
    });
    savePosts(posts);
    try{ localStorage.removeItem('apple129_share_draft'); }catch(e){}
    document.getElementById('composer').style.display = 'none';
    renderFeed();
  });
}

renderFeed();
</script>
