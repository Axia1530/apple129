<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple No.129 — Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&family=Pathway+Extreme:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1210; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#ffffff;}
  body{font-family:'Pathway Extreme',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 5vw 0;}
  .back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;opacity:0.8;cursor:pointer;}
  .back:hover{opacity:1;}
  .brandmark{font-family:'Notable',sans-serif;font-size:18px;letter-spacing:0.02em;opacity:0.85;}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 6vw 50px;gap:18px;text-align:center;}

  .stamp{
    font-family:'Notable',sans-serif;font-size:clamp(28px,5vw,44px);letter-spacing:0.04em;
    border:5px solid; border-radius:14px; padding:10px 30px;
    transform:rotate(-6deg) scale(0.8); opacity:0; transition:opacity .6s ease, transform .6s cubic-bezier(.34,1.3,.64,1);
  }
  .stamp.show{opacity:1; transform:rotate(-6deg) scale(1);}
  .stamp.pass{color:#2f8350;border-color:#2f8350;}
  .stamp.fail{color:#c8102e;border-color:#c8102e;}

  .result-note{max-width:480px;font-size:13.5px;line-height:1.6;opacity:0.65;}

  .scene-slot{
    position:relative;width:min(560px,88vw);aspect-ratio:4/3;border-radius:16px;
    overflow:hidden;background:rgba(0,0,0,0.04) center/cover no-repeat;
    box-shadow:0 14px 34px rgba(0,0,0,0.14);
  }
  .scene-apple{
    position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;
    object-fit:contain;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,0.45)) drop-shadow(0 2px 5px rgba(0,0,0,0.35));
  }
  .scene-apple.grabbing{cursor:grabbing;}
  .resize-handle{
    position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2.5px solid #c8102e;cursor:nwse-resize;touch-action:none;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }
  .drag-hint{font-size:11px;opacity:0.45;margin-top:-6px;}

  .exportBtn{
    font-family:'Notable',sans-serif;font-weight:400;font-size:13px;color:#fff;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;padding:0.6em 1.4em 0.7em;cursor:pointer;
    box-shadow:0 8px 18px rgba(60,10,10,0.25), inset 0 2px 4px rgba(255,255,255,0.35);
    margin-top:4px;
  }
  .exportBtn:active{transform:translateY(1px);}

  .postcardModal{
    position:fixed;inset:0;z-index:40;background:rgba(20,12,10,0.72);
    display:none;align-items:center;justify-content:center;padding:4vh 4vw;
  }
  .postcardPanel{
    background:#fff;border-radius:18px;padding:26px 28px 30px;
    max-width:520px;width:100%;max-height:90vh;overflow:auto;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
    display:flex;flex-direction:column;align-items:center;gap:16px;
  }
  .postcardPanel-head{display:flex;justify-content:space-between;align-items:center;width:100%;}
  .postcardPanel h2{font-family:'Notable',sans-serif;font-weight:400;font-size:18px;margin:0;}
  .postcardClose{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;opacity:0.5;padding:4px;}
  .postcardClose:hover{opacity:1;}
  .postcardHint{font-size:12px;opacity:0.55;margin:-4px 0 4px;text-align:center;}
  .postcardGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;}
  .postcard-cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .postcard-thumb{width:100%;height:auto;border-radius:8px;cursor:pointer;border:1.5px solid rgba(0,0,0,0.1);transition:transform .15s ease, box-shadow .15s ease;}
  .postcard-thumb:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.18);}
  .postcard-label{font-weight:700;font-size:12px;opacity:0.7;}
  @media (max-width:420px){ .postcardGrid{grid-template-columns:1fr;} }

  #debugErr{
    position:fixed;top:90px;left:5vw;right:5vw;z-index:50;font:11px monospace;color:#b00020;
    background:rgba(255,255,255,0.95);border:1px solid #b00020;border-radius:8px;padding:8px;
    display:none;white-space:pre-wrap;max-height:30vh;overflow:auto;
  }
</style>
</head>
<body>
<div id="debugErr"></div>

<div class="topbar">
  <a class="back" id="backLink">&larr; BACK</a>
  <div class="brandmark">APPLE NO.129</div>
</div>

<div class="stage">
  <div class="stamp" id="stampEl"></div>
  <div class="result-note" id="resultNote"></div>
  <div class="scene-slot" id="sceneSlot"></div>
  <div class="drag-hint" id="dragHint" style="display:none;">Drag your apple to move it &middot; drag the dot to resize</div>
  <button class="exportBtn" id="exportBtn" style="display:none;">EXPORT POSTCARD</button>
  <button class="exportBtn" id="shareBtn" style="display:none;">SHARE YOUR POSTCARD</button>
</div>

<div class="postcardModal" id="postcardModal">
  <div class="postcardPanel">
    <div class="postcardPanel-head">
      <h2>Choose a version</h2>
      <button class="postcardClose" id="postcardClose">&times;</button>
    </div>
    <div class="postcardHint" id="postcardHint">Click a version to save it to your device.</div>
    <div class="postcardGrid" id="postcardGrid"></div>
  </div>
</div>

<script>
function showErr(msg){
  const el = document.getElementById('debugErr');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', e=> showErr('Error: ' + e.message));

document.getElementById('backLink').addEventListener('click', ()=>{
  if(document.referrer){ history.back(); } else { window.location.href = 'grading.html'; }
});

let userName = 'You', appleName = 'your apple';
try{
  userName = localStorage.getItem('apple129_username') || userName;
  appleName = localStorage.getItem('apple129_applename') || appleName;
}catch(e){}

let artwork = null;
try{ artwork = localStorage.getItem('apple129_artwork'); }catch(e){}

let result = null;
try{ result = localStorage.getItem('apple129_gradeResult'); }catch(e){}

let gradeDetails = null;
try{ gradeDetails = JSON.parse(localStorage.getItem('apple129_gradeDetails') || 'null'); }catch(e){}

const SLOTS = {
  pass: { left:36, top:52, width:20 },
  fail: { left:34, top:40, width:18 }
};

if(result !== 'pass' && result !== 'fail'){
  window.location.href = 'grading.html';
} else {
  const pass = result === 'pass';
  const bgSrc = pass ? 'assets/shelf.jpg' : 'assets/trash.jpg';
  const stampEl = document.getElementById('stampEl');
  const noteEl = document.getElementById('resultNote');
  const slotEl = document.getElementById('sceneSlot');
  const noteText = pass
    ? ('After layer upon layer of inspection, ' + appleName + ' has finally reached the supermarket shelf — one more apple among thousands that all look exactly the same.')
    : ('Once, ' + appleName + ' held infinite possibility. But under today’s strict commercial standards, it didn’t make the cut — and has ended up here, where unwanted food is thrown away.');

  stampEl.classList.add(pass ? 'pass' : 'fail');
  stampEl.textContent = pass ? 'GRADE A' : 'REJECTED';
  noteEl.textContent = noteText;
  slotEl.style.backgroundImage = "url('" + bgSrc + "')";

  const sceneImg = new Image();
  sceneImg.src = bgSrc;

  if(artwork){
    const slot = SLOTS[pass ? 'pass' : 'fail'];
    const appleImg = document.createElement('img');
    appleImg.className = 'scene-apple';
    appleImg.draggable = false;
    appleImg.src = artwork;
    appleImg.style.left = slot.left + '%';
    appleImg.style.top = slot.top + '%';
    appleImg.style.width = slot.width + '%';
    appleImg.style.height = 'auto';
    slotEl.appendChild(appleImg);

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';
    slotEl.appendChild(resizeHandle);

    function positionResizeHandle(){
      const r = appleImg.getBoundingClientRect();
      const vr = slotEl.getBoundingClientRect();
      resizeHandle.style.left = (r.right - vr.left - 8) + 'px';
      resizeHandle.style.top = (r.bottom - vr.top - 8) + 'px';
    }
    appleImg.onload = positionResizeHandle;
    setTimeout(positionResizeHandle, 50);

    let dragState = null;
    appleImg.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      const vr = slotEl.getBoundingClientRect();
      dragState = {
        startX: e.clientX, startY: e.clientY,
        origLeftPct: parseFloat(appleImg.style.left),
        origTopPct: parseFloat(appleImg.style.top),
        vrW: vr.width, vrH: vr.height
      };
      appleImg.classList.add('grabbing');
      appleImg.setPointerCapture(e.pointerId);
    });
    appleImg.addEventListener('pointermove', e=>{
      if(!dragState) return;
      const dxPct = (e.clientX - dragState.startX) / dragState.vrW * 100;
      const dyPct = (e.clientY - dragState.startY) / dragState.vrH * 100;
      appleImg.style.left = (dragState.origLeftPct + dxPct) + '%';
      appleImg.style.top = (dragState.origTopPct + dyPct) + '%';
      positionResizeHandle();
    });
    appleImg.addEventListener('pointerup', ()=>{ dragState=null; appleImg.classList.remove('grabbing'); });
    appleImg.addEventListener('pointercancel', ()=>{ dragState=null; appleImg.classList.remove('grabbing'); });

    let resizeState = null;
    resizeHandle.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      const vr = slotEl.getBoundingClientRect();
      resizeState = {
        startX: e.clientX,
        origWidthPct: parseFloat(appleImg.style.width),
        vrW: vr.width
      };
      resizeHandle.setPointerCapture(e.pointerId);
    });
    resizeHandle.addEventListener('pointermove', e=>{
      if(!resizeState) return;
      const dPct = (e.clientX - resizeState.startX) / resizeState.vrW * 100;
      let w = resizeState.origWidthPct + dPct;
      w = Math.max(4, Math.min(70, w));
      appleImg.style.width = w + '%';
      positionResizeHandle();
    });
    resizeHandle.addEventListener('pointerup', ()=> resizeState=null);
    resizeHandle.addEventListener('pointercancel', ()=> resizeState=null);

    appleImg.addEventListener('wheel', e=>{
      e.preventDefault();
      let w = parseFloat(appleImg.style.width);
      w *= (e.deltaY < 0 ? 1.07 : 0.93);
      w = Math.max(4, Math.min(70, w));
      appleImg.style.width = w + '%';
      positionResizeHandle();
    }, { passive:false });

    window.addEventListener('resize', positionResizeHandle);

    document.getElementById('dragHint').style.display = 'block';
    document.getElementById('exportBtn').style.display = 'inline-flex';
    document.getElementById('shareBtn').style.display = 'inline-flex';

    /* ---------- export: single white postcard with stamp + note ---------- */
    function drawCover(ctx, img, dx, dy, dw, dh){
      const ir = img.naturalWidth / img.naturalHeight;
      const dr = dw / dh;
      let sx, sy, sw, sh;
      if(ir > dr){
        sh = img.naturalHeight; sw = sh * dr;
        sx = (img.naturalWidth - sw) / 2; sy = 0;
      } else {
        sw = img.naturalWidth; sh = sw / dr;
        sx = 0; sy = (img.naturalHeight - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
    }

    function wrapLines(ctx, text, maxWidth){
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for(let n = 0; n < words.length; n++){
        const test = (line + words[n] + ' ');
        if(ctx.measureText(test).width > maxWidth && line){
          lines.push(line.trim());
          line = words[n] + ' ';
        } else {
          line = test;
        }
      }
      if(line) lines.push(line.trim());
      return lines;
    }

    function drawAppleOnScene(ctx, border, imgW, imgH){
      if(!(appleImg.complete && appleImg.naturalWidth)) return;
      const leftPct = parseFloat(appleImg.style.left);
      const topPct = parseFloat(appleImg.style.top);
      const widthPct = parseFloat(appleImg.style.width);
      const aw = (widthPct/100) * imgW;
      const ah = aw * (appleImg.naturalHeight / appleImg.naturalWidth);
      const ax = border + (leftPct/100) * imgW;
      const ay = border + (topPct/100) * imgH;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 8;
      ctx.drawImage(appleImg, ax, ay, aw, ah);
      ctx.restore();
    }

    function drawStamp(ctx, cx, cy, angleDeg, fontSize){
      const stampColor = pass ? '#2f8350' : '#c8102e';
      const stampText = pass ? 'GRADE A' : 'REJECTED';
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angleDeg * Math.PI/180);
      ctx.font = '700 ' + fontSize + 'px Notable, sans-serif';
      ctx.textAlign = 'center';
      const stw = ctx.measureText(stampText).width;
      const pad = fontSize*0.55, h = fontSize*1.75;
      ctx.lineWidth = Math.max(3, fontSize*0.16);
      ctx.strokeStyle = stampColor;
      ctx.strokeRect(-stw/2 - pad, -h/2, stw + pad*2, h);
      ctx.fillStyle = stampColor;
      ctx.fillText(stampText, 0, fontSize*0.32);
      ctx.restore();
    }

    /* ---------- template A: scene postcard ---------- */
    function exportScenePostcard(){
      const W = 700, border = 60;
      const imgW = W - border*2, imgH = imgW * 0.75;

      const noteFont = '14.5px Georgia, "Times New Roman", serif';
      const measure = document.createElement('canvas').getContext('2d');
      measure.font = noteFont;
      const noteLines = wrapLines(measure, noteText, W - border*2);
      const noteH = noteLines.length * 21;

      const H = border + imgH + 28 + noteH + border;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      drawCover(ctx, sceneImg, border, border, imgW, imgH);
      drawAppleOnScene(ctx, border, imgW, imgH);

      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      ctx.strokeRect(border, border, imgW, imgH);

      drawStamp(ctx, 555, 80, 16, 32);

      ctx.fillStyle = '#2a2320';
      ctx.font = noteFont;
      ctx.textAlign = 'center';
      let ny = border + imgH + 28;
      noteLines.forEach(ln=>{
        ctx.fillText(ln, W/2, ny);
        ny += 21;
      });

      return canvas;
    }

    /* ---------- template B: score report postcard ---------- */
    function drawMiniGauge(ctx, cx, cy, r, score){
      const color = score >= 80 ? '#4caf6d' : score >= 50 ? '#e0a83a' : '#c8102e';
      ctx.lineWidth = r*0.24;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 2*Math.PI); ctx.stroke();
      ctx.strokeStyle = color;
      ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + (score/100)*Math.PI); ctx.stroke();
      const angle = Math.PI + (score/100)*Math.PI;
      ctx.lineWidth = 3; ctx.strokeStyle = '#1b1210'; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + r*0.82*Math.cos(angle), cy + r*0.82*Math.sin(angle));
      ctx.stroke();
      ctx.fillStyle = '#1b1210';
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
    }

    function exportScoreCard(){
      const W = 700, margin = 50;
      const scratch = document.createElement('canvas');
      scratch.width = W; scratch.height = 1100;
      const ctx = scratch.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, scratch.height);

      let y = 44;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#1b1210';
      ctx.font = '700 24px Georgia, "Times New Roman", serif';
      ctx.fillText('OFFICIAL GRADING REPORT', W/2, y);
      y += 24;
      ctx.font = 'italic 13px Georgia, serif';
      ctx.fillStyle = '#6b5d52';
      ctx.fillText('Apple ' + appleName + ' · graded against real commercial standards', W/2, y);
      y += 26;

      const imgW = W - margin*2, imgH = imgW * 0.56;
      drawCover(ctx, sceneImg, margin, y, imgW, imgH);
      drawAppleOnScene(ctx, margin, imgW, imgH);
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      ctx.strokeRect(margin, y, imgW, imgH);
      drawStamp(ctx, margin + imgW - 80, y + 36, 14, 24);
      y += imgH + 50;

      const details = gradeDetails || [];
      const n = details.length || 5;
      const cellW = (W - margin*2) / n;
      const gaugeR = Math.min(34, cellW*0.36);
      details.forEach((d, i)=>{
        const cx = margin + cellW*i + cellW/2;
        ctx.font = '700 10px Pathway Extreme, Arial, sans-serif';
        ctx.fillStyle = '#6b5d52';
        ctx.textAlign = 'center';
        ctx.fillText(d.label.toUpperCase(), cx, y);
        drawMiniGauge(ctx, cx, y + gaugeR + 14, gaugeR, d.score);
        ctx.font = '700 11px Pathway Extreme, Arial, sans-serif';
        ctx.fillStyle = '#1b1210';
        ctx.fillText(d.valueText, cx, y + gaugeR + 36);
      });
      y += gaugeR + 60;

      y += 10;
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(W-margin, y); ctx.stroke();
      y += 26;

      const noteFont = '13.5px Georgia, "Times New Roman", serif';
      ctx.font = noteFont;
      const noteLines = wrapLines(ctx, noteText, W - margin*2);
      ctx.fillStyle = '#2a2320';
      noteLines.forEach(ln=>{
        ctx.fillText(ln, W/2, y);
        y += 20;
      });
      y += 14;

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = W;
      finalCanvas.height = Math.ceil(y);
      finalCanvas.getContext('2d').drawImage(scratch, 0, 0);
      return finalCanvas;
    }

    const POSTCARD_TEMPLATES = [
      { id:'scene', label:'Postcard', build: exportScenePostcard }
    ];
    if(gradeDetails && gradeDetails.length){
      POSTCARD_TEMPLATES.push({ id:'score', label:'Grading report', build: exportScoreCard });
    }

    function downloadCanvas(canvas, id){
      const link = document.createElement('a');
      link.download = 'apple129-' + (pass ? 'graded' : 'rejected') + '-' + id + '.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function shareCanvas(canvas){
      try{
        localStorage.setItem('apple129_share_draft', canvas.toDataURL('image/png'));
      }catch(e){ showErr('share failed: ' + e.message); return; }
      window.location.href = 'forum.html';
    }

    function openPostcardModal(mode){
      const grid = document.getElementById('postcardGrid');
      grid.innerHTML = '';
      document.getElementById('postcardHint').textContent = mode === 'share'
        ? 'Click a version to share it to the Orchard Board.'
        : 'Click a version to save it to your device.';
      POSTCARD_TEMPLATES.forEach(tpl=>{
        const canvas = tpl.build();
        canvas.className = 'postcard-thumb';
        canvas.title = mode === 'share' ? 'Click to share this version' : 'Click to save this version';
        canvas.addEventListener('click', ()=>{
          if(mode === 'share') shareCanvas(canvas);
          else downloadCanvas(canvas, tpl.id);
        });

        const label = document.createElement('div');
        label.className = 'postcard-label';
        label.textContent = tpl.label;

        const cell = document.createElement('div');
        cell.className = 'postcard-cell';
        cell.appendChild(canvas);
        cell.appendChild(label);
        grid.appendChild(cell);
      });
      document.getElementById('postcardModal').style.display = 'flex';
    }

    document.getElementById('exportBtn').addEventListener('click', ()=>{
      try{ openPostcardModal('download'); }catch(e){ showErr('export failed: ' + e.message); }
    });
    document.getElementById('shareBtn').addEventListener('click', ()=>{
      try{ openPostcardModal('share'); }catch(e){ showErr('share failed: ' + e.message); }
    });
    document.getElementById('postcardClose').addEventListener('click', ()=>{
      document.getElementById('postcardModal').style.display = 'none';
    });
    document.getElementById('postcardModal').addEventListener('click', e=>{
      if(e.target.id === 'postcardModal') document.getElementById('postcardModal').style.display = 'none';
    });
  }

  setTimeout(()=> stampEl.classList.add('show'), 150);
}
</script>
