<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple No.129 — Texture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&family=Pathway+Extreme:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1210; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#ffffff;}
  body{font-family:'Pathway Extreme',sans-serif;color:var(--ink);}
  #canvasHost{position:fixed;inset:0;}
  canvas{display:block;touch-action:none;}

  .ui{position:fixed;inset:0;z-index:5;pointer-events:none;}
  .ui a, .ui button, .panel, .panel *{pointer-events:auto;}

  .topbar{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:28px 7vw 0;
  }
  .back{
    color:var(--ink);text-decoration:none;
    font-family:'Pathway Extreme',sans-serif;font-weight:700;font-size:14px;
    opacity:0.8;display:flex;align-items:center;gap:6px;
  }
  .back:hover{opacity:1;}
  .brandmark{
    font-family:'Notable',sans-serif;font-size:18px;letter-spacing:0.02em;opacity:0.85;
    text-align:right;
  }
  .kicker{
    position:absolute;top:84px;left:0;right:0;text-align:center;
    font-family:'Pathway Extreme',sans-serif;font-weight:800;
    font-size:clamp(14px,1.8vw,20px);
    letter-spacing:0.03em;text-transform:uppercase;
    opacity:0.85;
  }
  .hint{
    position:absolute;top:118px;left:0;right:0;text-align:center;
    font-family:'Pathway Extreme',sans-serif;font-weight:400;
    font-size:clamp(11px,1.2vw,14px);
    opacity:0.55;
  }

  .panel{
    position:absolute;left:5vw;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:18px;
    width:168px;
  }
  .panel-group{display:flex;flex-direction:column;gap:8px;}
  .panel-label{
    font-family:'Pathway Extreme',sans-serif;font-weight:800;font-size:11px;
    text-transform:uppercase;letter-spacing:0.06em;opacity:0.6;
  }
  .brush-row{display:flex;gap:8px;}
  .brush-btn, .preset-btn{
    font-family:'Pathway Extreme',sans-serif;font-weight:700;font-size:12.5px;
    color:var(--ink);
    background:rgba(0,0,0,0.035);
    border:1.5px solid rgba(0,0,0,0.15);
    border-radius:10px;
    padding:8px 10px;
    cursor:pointer;
    text-align:center;
    flex:1;
  }
  .brush-btn.active, .preset-btn.active{
    background:var(--ink);color:#fff;border-color:var(--ink);
  }
  .preset-col{display:flex;flex-direction:column;gap:8px;}
  .colorpicker{display:flex;align-items:center;gap:12px;}
  .wheelWrap{position:relative;width:116px;height:116px;}
  #wheelCanvas{border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,0.18);display:block;}
  .wheelMarker{
    position:absolute;width:14px;height:14px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.45), 0 2px 5px rgba(0,0,0,0.3);
    transform:translate(-50%,-50%);pointer-events:none;
  }
  .valBar{width:14px;height:100px;border-radius:999px;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.15);cursor:pointer;}
  .valKnob{position:absolute;left:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(0,0,0,0.3);}
  .clear-link{
    font-family:'Pathway Extreme',sans-serif;font-weight:700;font-size:12px;
    color:#b23a3a;background:none;border:none;cursor:pointer;
    text-align:left;padding:2px 0;
  }

  .bottom{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:0 7vw 34px;
  }
  .count-chip{
    background:rgba(0,0,0,0.035);
    border:1px solid rgba(0,0,0,0.12);
    border-radius:14px;
    padding:7px 16px;
    font-family:'Pathway Extreme',sans-serif;font-weight:700;font-size:12.5px;
    opacity:0.8;
  }
  .nextBtn{
    font-family:'Notable',sans-serif;font-weight:400;
    font-size:15px;color:#fff;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;
    padding:0.55em 1.4em 0.65em;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(60,10,10,0.25), inset 0 2px 4px rgba(255,255,255,0.35);
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
  }
</style>
</head>
<body>
<div id="canvasHost"></div>

<div class="ui">
  <div class="topbar">
    <a class="back" href="builder.html">&larr; BACK</a>
    <div class="brandmark">APPLE NO.129</div>
  </div>
  <div class="kicker">Mark your apple</div>
  <div class="hint">Tap the apple to add a mark &middot; drag anywhere else to rotate</div>

  <div class="panel">
    <div class="panel-group">
      <div class="panel-label">Tool</div>
      <div class="brush-row">
        <button class="brush-btn active" id="toolMark">Blemish</button>
        <button class="brush-btn" id="toolPaint">Paint</button>
      </div>
    </div>
    <div class="panel-group" id="markTools">
      <div class="panel-label">Mark size</div>
      <div class="brush-row">
        <button class="brush-btn active" id="brushSmall">Spot</button>
        <button class="brush-btn" id="brushLarge">Scar</button>
      </div>
    </div>
    <div class="panel-group" id="markPresets">
      <div class="panel-label">Skin pattern</div>
      <div class="preset-col">
        <button class="preset-btn" id="presetClean">Clean</button>
        <button class="preset-btn" id="presetFreckled">Freckled</button>
        <button class="preset-btn" id="presetScarred">Heavily marked</button>
      </div>
    </div>
    <div class="panel-group" id="paintTools" style="display:none;">
      <div class="panel-label">Brush colour</div>
      <div class="colorpicker">
        <div class="wheelWrap">
          <canvas id="wheelCanvas" width="116" height="116"></canvas>
          <div class="wheelMarker" id="wheelMarker"></div>
        </div>
        <div class="valBar" id="valBar"><div class="valKnob" id="valKnob"></div></div>
      </div>
      <div class="panel-label" style="margin-top:4px;">Brush size</div>
      <div class="brush-row">
        <button class="brush-btn active" id="paintSmall">S</button>
        <button class="brush-btn" id="paintMedium">M</button>
        <button class="brush-btn" id="paintLarge">L</button>
      </div>
    </div>
    <button class="clear-link" id="clearBtn">Clear all marks</button>
  </div>

  <div id="debugErr" style="position:absolute;top:150px;left:5vw;right:5vw;z-index:50;font:11px monospace;color:#b00020;background:rgba(255,255,255,0.92);border:1px solid #b00020;border-radius:8px;padding:8px;display:none;white-space:pre-wrap;max-height:30vh;overflow:auto;"></div>

  <div class="bottom">
    <div class="count-chip"><span id="markCount">0</span> marks on this apple</div>
    <button class="nextBtn" id="nextBtn">NEXT STEP &rarr;</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

function showErr(msg){
  const el = document.getElementById('debugErr');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', e=> showErr('Error: ' + e.message));
window.addEventListener('unhandledrejection', e=> showErr('Promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

const host = document.getElementById('canvasHost');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 8, 24);
let skyMesh, floorMesh;

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 8;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 1.45;
controls.update();

/* ---------- depth background: large gradient sphere ---------- */
{
  const geo = new THREE.SphereGeometry(40, 32, 32);
  const colorsAttr = [];
  const topColor = new THREE.Color(0xffffff);
  const horizonColor = new THREE.Color(0xf7e2db);
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const y = pos.getY(i)/40;
    const t = 1 - Math.abs(y);
    const c = topColor.clone().lerp(horizonColor, Math.pow(t,1.6));
    colorsAttr.push(c.r,c.g,c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colorsAttr,3));
  const mat = new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false });
  skyMesh = new THREE.Mesh(geo, mat);
  scene.add(skyMesh);
}

/* ---------- floor ---------- */
{
  const floorGeo = new THREE.CircleGeometry(20, 64);
  floorGeo.rotateX(-Math.PI/2);
  const floorMat = new THREE.MeshStandardMaterial({ color:0xf1e9e5, roughness:0.85, metalness:0.0 });
  floorMesh = new THREE.Mesh(floorGeo, floorMat);
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);
}

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.15);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-4; key.shadow.camera.right=4;
key.shadow.camera.top=4; key.shadow.camera.bottom=-4;
key.shadow.radius = 4;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffe8df, 0.4);
fill.position.set(-4, 2, -3);
scene.add(fill);
const rim = new THREE.PointLight(0xffffff, 0.3, 10);
rim.position.set(0,3,-3);
scene.add(rim);

/* ---------- carried-over shape + colour ---------- */

try{
  const raw = localStorage.getItem('apple129_shape');
  if(raw) carried = Object.assign(carried, JSON.parse(raw));
}catch(e){ showErr('localStorage read failed: ' + e.message); }

function safeNum(v, fallback){
  return (typeof v === 'number' && isFinite(v)) ? v : fallback;
}
carried.scale = {
  x: safeNum(carried.scale && carried.scale.x, 1),
  y: safeNum(carried.scale && carried.scale.y, 1),
  z: safeNum(carried.scale && carried.scale.z, 1)
};
if(typeof carried.color !== 'string') carried.color = '#c8102e';

/* ---------- real apple model (glTF) ---------- */

appleGroup.position.set(0, 1.0, 0);
appleGroup.scale.set(carried.scale.x, carried.scale.y, carried.scale.z);
scene.add(appleGroup);

function base64ToArrayBuffer(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

new GLTFLoader().parse(base64ToArrayBuffer(APPLE_GLB_BASE64), '', (gltf)=>{
  try{
    const model = gltf.scene;
    model.rotation.x = -Math.PI/2;
    model.updateMatrixWorld(true);

    model.traverse(child=>{
      if(child.isMesh){
        child.castShadow = true;
        child.receiveShadow = false;
        const c = child.material.color;
        if(c.r > c.g && c.r > c.b){
          c.set(carried.color);
          // DecalGeometry chokes on this model's indexed geometry (geometry.index
          // ends up neither a real attribute nor strictly null) - force it into a
          // clean non-indexed form with real normals before it's used as a target.
          child.geometry = child.geometry.toNonIndexed();
          if(!child.geometry.attributes.normal) child.geometry.computeVertexNormals();
          bodyMesh = child;
          decalMeshes.push(child);
        }
      }
    });

    if(!bodyMesh) showErr('Warning: could not identify the body mesh (no reddish material found).');

    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3(); box.getCenter(center);
    model.position.sub(center);

    const size = new THREE.Vector3(); box.getSize(size);
    const TARGET_R = 0.9, TARGET_H = 1.0;
    const uniform = Math.min(TARGET_R/(size.x/2), TARGET_H/(size.y/2), TARGET_R/(size.z/2));

    const modelRoot = new THREE.Group();
    modelRoot.add(model);
    modelRoot.scale.setScalar(uniform);
    appleGroup.add(modelRoot);
  }catch(err){
    showErr('Model setup failed: ' + err.message);
  }
}, (err)=>{
  showErr('GLTF parse failed: ' + (err && err.message ? err.message : err));
});

/* ---------- blemish decals ---------- */
function makeBlemishTexture(){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64,64,4,64,64,60);
  const tones = ['#5c3a22','#6b4226','#7a4a2a','#8a5a34'];
  const tone = tones[Math.floor(Math.random()*tones.length)];
  grad.addColorStop(0, tone+'ee');
  grad.addColorStop(0.7, tone+'99');
  grad.addColorStop(1, tone+'00');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(64,64, 44+Math.random()*14, 34+Math.random()*14, Math.random()*Math.PI, 0, Math.PI*2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
}

function makePaintTexture(hex){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64,64,0,64,64,60);
  grad.addColorStop(0, hex);
  grad.addColorStop(0.82, hex);
  grad.addColorStop(1, hex+'00');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(64,64,62,0,Math.PI*2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
}

let toolMode = 'mark'; // 'mark' | 'paint'
let brushSize = 0.075; // 'Spot'
let paintBrushSize = 0.05; // 'S'
let paintColor = '#c8102e';
let markCount = 0;
const decalGroup = new THREE.Group();
scene.add(decalGroup);

function stampDecal(point, normal, sizeMul, mode){
  if(!bodyMesh){ showErr('stampDecal: no body mesh yet (model still loading?)'); return; }
  mode = mode || 'mark';
  try{
    const baseSize = mode === 'paint' ? paintBrushSize : brushSize;
    const s = baseSize * (sizeMul||1) * (mode === 'paint' ? 1 : (0.8+Math.random()*0.5));
    const orientHelper = new THREE.Object3D();
    orientHelper.position.copy(point);
    orientHelper.lookAt(point.clone().add(normal));
    orientHelper.rotateZ(Math.random()*Math.PI*2);

    const decalGeo = new DecalGeometry(bodyMesh, point, orientHelper.rotation, new THREE.Vector3(s, s, s*0.6));
    const tex = mode === 'paint' ? makePaintTexture(paintColor) : makeBlemishTexture();
    const mat = new THREE.MeshStandardMaterial({
      map: tex, transparent:true, depthTest:true, depthWrite:false,
      polygonOffset:true, polygonOffsetFactor:-4, roughness:0.9
    });
    const decalMesh = new THREE.Mesh(decalGeo, mat);
    decalGroup.add(decalMesh);
    if(mode !== 'paint'){
      markCount++;
      document.getElementById('markCount').textContent = markCount;
    }
  }catch(err){
    showErr('stampDecal failed: ' + err.message);
  }
}

function clearDecals(){
  while(decalGroup.children.length){
    const m = decalGroup.children.pop();
    m.geometry.dispose();
    m.material.map && m.material.map.dispose();
    m.material.dispose();
  }
  markCount = 0;
  document.getElementById('markCount').textContent = markCount;
}

function scatterPattern(count, sizeMul){
  if(!bodyMesh){ showErr('scatterPattern: no body mesh yet (model still loading?)'); return; }
  const raycaster = new THREE.Raycaster();
  let placed = 0, tries = 0;
  while(placed < count && tries < count*8){
    tries++;
    const dir = new THREE.Vector3(
      Math.random()*2-1, Math.random()*2-1, Math.random()*2-1
    ).normalize();
    const origin = appleGroup.position.clone().add(dir.clone().multiplyScalar(3));
    raycaster.set(origin, dir.clone().negate());
    const hits = raycaster.intersectObject(bodyMesh, false);
    if(hits.length){
      stampDecal(hits[0].point, hits[0].face.normal.clone().transformDirection(bodyMesh.matrixWorld), sizeMul);
      placed++;
    }
  }
}

/* ---------- Procreate-style HSV colour wheel for the paint brush ---------- */
function hsvToRgbPaint(h,s,v){
  const c = v*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = v-c;
  let r,g,b;
  if(h<60){[r,g,b]=[c,x,0];}
  else if(h<120){[r,g,b]=[x,c,0];}
  else if(h<180){[r,g,b]=[0,c,x];}
  else if(h<240){[r,g,b]=[0,x,c];}
  else if(h<300){[r,g,b]=[x,0,c];}
  else {[r,g,b]=[c,0,x];}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbToHexPaint(r,g,b){ return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join(''); }
function hexToHsvPaint(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=60*(((g-b)/d)%6);
    else if(max===g) h=60*((b-r)/d+2);
    else h=60*((r-g)/d+4);
  }
  if(h<0) h+=360;
  const s = max===0 ? 0 : d/max;
  return { h, s, v:max };
}

const wheelCanvasPaint = document.getElementById('wheelCanvas');
const wheelCtxPaint = wheelCanvasPaint.getContext('2d');
const wheelMarkerPaint = document.getElementById('wheelMarker');
const valBarPaint = document.getElementById('valBar');
const valKnobPaint = document.getElementById('valKnob');
const WHEEL_SIZE_P = wheelCanvasPaint.width;
const WHEEL_R_P = WHEEL_SIZE_P/2;
const paintColorState = hexToHsvPaint(paintColor);

function drawWheelPaint(){
  const img = wheelCtxPaint.createImageData(WHEEL_SIZE_P, WHEEL_SIZE_P);
  for(let y=0;y<WHEEL_SIZE_P;y++){
    for(let x=0;x<WHEEL_SIZE_P;x++){
      const dx = x-WHEEL_R_P, dy = y-WHEEL_R_P;
      const dist = Math.sqrt(dx*dx+dy*dy);
      const idx = (y*WHEEL_SIZE_P+x)*4;
      if(dist<=WHEEL_R_P){
        let angle = Math.atan2(dy,dx)*180/Math.PI;
        if(angle<0) angle+=360;
        const sat = Math.min(1, dist/WHEEL_R_P);
        const [r,g,b] = hsvToRgbPaint(angle, sat, paintColorState.v);
        img.data[idx]=r; img.data[idx+1]=g; img.data[idx+2]=b; img.data[idx+3]=255;
      } else {
        img.data[idx+3]=0;
      }
    }
  }
  wheelCtxPaint.putImageData(img,0,0);
}
function drawValBarPaint(){
  const [r,g,b] = hsvToRgbPaint(paintColorState.h, paintColorState.s, 1);
  valBarPaint.style.background = `linear-gradient(to top, #000, rgb(${r},${g},${b}))`;
}
function positionWheelMarkerPaint(){
  const dist = paintColorState.s*WHEEL_R_P;
  const rad = paintColorState.h*Math.PI/180;
  wheelMarkerPaint.style.left = (WHEEL_R_P + Math.cos(rad)*dist)+'px';
  wheelMarkerPaint.style.top = (WHEEL_R_P + Math.sin(rad)*dist)+'px';
}
function positionValKnobPaint(){
  const h = valBarPaint.clientHeight || 100;
  valKnobPaint.style.top = ((1-paintColorState.v)*h)+'px';
}
function applyPaintColor(){
  const [r,g,b] = hsvToRgbPaint(paintColorState.h, paintColorState.s, paintColorState.v);
  paintColor = rgbToHexPaint(r,g,b);
}

function wheelPointFromEventPaint(e){
  const rect = wheelCanvasPaint.getBoundingClientRect();
  const x = e.clientX-rect.left-WHEEL_R_P;
  const y = e.clientY-rect.top-WHEEL_R_P;
  let dist = Math.sqrt(x*x+y*y);
  dist = Math.min(dist, WHEEL_R_P);
  let angle = Math.atan2(y,x)*180/Math.PI;
  if(angle<0) angle+=360;
  paintColorState.h = angle;
  paintColorState.s = dist/WHEEL_R_P;
}
let draggingWheelPaint=false, draggingValPaint=false;
wheelCanvasPaint.addEventListener('pointerdown', e=>{ e.stopPropagation(); draggingWheelPaint=true; wheelCanvasPaint.setPointerCapture(e.pointerId); wheelPointFromEventPaint(e); positionWheelMarkerPaint(); drawValBarPaint(); applyPaintColor(); });
wheelCanvasPaint.addEventListener('pointermove', e=>{ if(!draggingWheelPaint) return; wheelPointFromEventPaint(e); positionWheelMarkerPaint(); drawValBarPaint(); applyPaintColor(); });
wheelCanvasPaint.addEventListener('pointerup', ()=>draggingWheelPaint=false);
wheelCanvasPaint.addEventListener('pointercancel', ()=>draggingWheelPaint=false);

function valFromEventPaint(e){
  const rect = valBarPaint.getBoundingClientRect();
  let t = 1 - (e.clientY-rect.top)/rect.height;
  t = Math.max(0, Math.min(1, t));
  paintColorState.v = t;
}
valBarPaint.addEventListener('pointerdown', e=>{ e.stopPropagation(); draggingValPaint=true; valBarPaint.setPointerCapture(e.pointerId); valFromEventPaint(e); positionValKnobPaint(); drawWheelPaint(); applyPaintColor(); });
valBarPaint.addEventListener('pointermove', e=>{ if(!draggingValPaint) return; valFromEventPaint(e); positionValKnobPaint(); drawWheelPaint(); applyPaintColor(); });
valBarPaint.addEventListener('pointerup', ()=>draggingValPaint=false);
valBarPaint.addEventListener('pointercancel', ()=>draggingValPaint=false);

drawWheelPaint();
drawValBarPaint();
positionWheelMarkerPaint();
positionValKnobPaint();

/* ---------- presets ---------- */
document.getElementById('presetClean').addEventListener('click', ()=>{
  try{ clearDecals(); }catch(err){ showErr('presetClean failed: '+err.message); }
});
document.getElementById('presetFreckled').addEventListener('click', ()=>{
  try{ clearDecals(); scatterPattern(22, 0.5); }catch(err){ showErr('presetFreckled failed: '+err.message); }
});
document.getElementById('presetScarred').addEventListener('click', ()=>{
  try{ clearDecals(); scatterPattern(10, 1.6); }catch(err){ showErr('presetScarred failed: '+err.message); }
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  try{ clearDecals(); }catch(err){ showErr('clearBtn failed: '+err.message); }
});

/* ---------- click-to-stamp vs drag-to-orbit vs drag-to-paint ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;
let painting = false;
let lastPaintPoint = null;

function setPointer(e){
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left)/r.width)*2 - 1;
  pointer.y = -((e.clientY - r.top)/r.height)*2 + 1;
}

function raycastBody(e){
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObject(bodyMesh, false);
}

renderer.domElement.addEventListener('pointerdown', (e)=>{
  downPos = { x:e.clientX, y:e.clientY };
  if(toolMode === 'paint' && bodyMesh){
    try{
      const hits = raycastBody(e);
      if(hits.length){
        painting = true;
        controls.enabled = false;
        const normal = hits[0].face.normal.clone().transformDirection(bodyMesh.matrixWorld);
        stampDecal(hits[0].point, normal, 1, 'paint');
        lastPaintPoint = hits[0].point.clone();
      }
    }catch(err){
      showErr('paint start failed: ' + err.message);
    }
  }
});
renderer.domElement.addEventListener('pointermove', (e)=>{
  if(!painting) return;
  try{
    const hits = raycastBody(e);
    if(hits.length){
      const dist = hits[0].point.distanceTo(lastPaintPoint);
      if(dist > paintBrushSize*0.45){
        const normal = hits[0].face.normal.clone().transformDirection(bodyMesh.matrixWorld);
        stampDecal(hits[0].point, normal, 1, 'paint');
        lastPaintPoint = hits[0].point.clone();
      }
    }
  }catch(err){
    showErr('paint stroke failed: ' + err.message);
  }
});
renderer.domElement.addEventListener('pointerup', (e)=>{
  if(painting){
    painting = false;
    lastPaintPoint = null;
    controls.enabled = true;
  }
  if(!downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if(toolMode !== 'mark') return;
  if(moved > 6) return;
  if(!bodyMesh){ showErr('tap ignored: model not loaded yet'); return; }
  try{
    const hits = raycastBody(e);
    if(hits.length){
      const normal = hits[0].face.normal.clone().transformDirection(bodyMesh.matrixWorld);
      stampDecal(hits[0].point, normal, 1, 'mark');
    }
  }catch(err){
    showErr('tap handler failed: ' + err.message);
  }
});

/* ---------- next step: snapshot the 3D view, key out the background, save ---------- */
document.getElementById('nextBtn').addEventListener('click', ()=>{
  try{
    // the gradient sky + beige floor aren't pure white, so a white-distance
    // key leaves a visible halo. Swap to a flat white backdrop and hide the
    // floor just for this one render, so the key-out is clean.
    const prevBackground = scene.background;
    const prevFog = scene.fog;
    const skyWasVisible = skyMesh.visible;
    const floorWasVisible = floorMesh.visible;
    scene.background = new THREE.Color(0xffffff);
    scene.fog = null;
    skyMesh.visible = false;
    floorMesh.visible = false;

    renderer.render(scene, camera);
    const raw = renderer.domElement.toDataURL('image/png');

    scene.background = prevBackground;
    scene.fog = prevFog;
    skyMesh.visible = skyWasVisible;
    floorMesh.visible = floorWasVisible;

    const snap = new Image();
    const off = document.createElement('canvas');
    off.width = renderer.domElement.width;
    off.height = renderer.domElement.height;
    const octx = off.getContext('2d');
    snap.onload = ()=>{
      octx.drawImage(snap, 0, 0);
      const img = octx.getImageData(0,0,off.width,off.height);
      const d = img.data;
      for(let i=0;i<d.length;i+=4){
        const minc = Math.min(d[i],d[i+1],d[i+2]);
        const dist = 255 - minc;
        const alpha = Math.max(0, Math.min(255, dist*9));
        d[i+3] = alpha;
      }
      octx.putImageData(img,0,0);
      try{ localStorage.setItem('apple129_artwork', off.toDataURL('image/png')); }catch(e){}
      window.location.href = 'senses.html';
    };
    snap.src = raw;
  }catch(err){
    showErr('snapshot failed: ' + err.message);
    window.location.href = 'senses.html';
  }
});

/* ---------- resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- render loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
