<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple No.129 — Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Notable&family=Pathway+Extreme:wght@400;700;800&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1b1210; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#ffffff;}
  body{font-family:'Pathway Extreme',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 5vw 0;}
  .back{color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;opacity:0.8;}
  .back:hover{opacity:1;}
  .brandmark{font-family:'Notable',sans-serif;font-size:18px;letter-spacing:0.02em;opacity:0.85;}
  .kicker{text-align:center;font-weight:800;font-size:clamp(14px,1.8vw,20px);text-transform:uppercase;letter-spacing:0.03em;opacity:0.85;margin-top:4px;}
  .namebadge{text-align:center;font-size:11px;opacity:0.5;margin-top:2px;}
  .gradingEntry{
    display:inline-flex;align-items:center;justify-content:center;align-self:center;margin:10px auto 0;
    font-family:'Notable',sans-serif;font-weight:400;font-size:13px;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;padding:0.6em 1.4em 0.7em;cursor:pointer;
    box-shadow:0 8px 18px rgba(60,10,10,0.25), inset 0 2px 4px rgba(255,255,255,0.35);
    width:fit-content;
  }
  .gradingEntry:active{transform:translateY(1px);}

  .stage{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px 4vw 8px;gap:14px;
  }
  .era-head{text-align:center;}
  .era-year{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:#b23a3a;}
  .era-title{font-family:'Notable',sans-serif;font-weight:400;font-size:clamp(20px,3vw,30px);margin:4px 0 0;}

  .viewer{
    position:relative;width:min(640px,88vw);
    border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,0.12);
    background:#f3ece7;
    aspect-ratio:4/3;
  }
  .bg-painting{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .bg-blank{position:absolute;inset:0;background:#ffffff;}

  .apple-layer{
    position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;
    filter:drop-shadow(0 10px 14px rgba(0,0,0,0.45)) drop-shadow(0 2px 5px rgba(0,0,0,0.35));
    display:none;
  }
  .apple-layer.grabbing{cursor:grabbing;}
  .apple-layer-fixed{
    position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none;
    object-fit:contain;filter:grayscale(1);display:none;
  }
  .resize-handle{
    position:absolute;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2.5px solid #c8102e;cursor:nwse-resize;touch-action:none;
    display:none;box-shadow:0 2px 5px rgba(0,0,0,0.3);
  }


  .story{max-width:560px;font-size:13.5px;line-height:1.6;text-align:center;opacity:0.8;min-height:60px;}
  .callout{max-width:560px;font-size:15px;font-weight:800;line-height:1.5;text-align:center;color:#c8102e;margin-top:-6px;}

  .exportBtn{
    font-family:'Notable',sans-serif;font-weight:400;font-size:13px;color:#fff;
    background:linear-gradient(135deg,#c75a56 0%, #e8a6a0 55%, #f0c2b8 100%);
    border:none;border-radius:999px;padding:0.5em 1.2em 0.6em;cursor:pointer;
    box-shadow:0 6px 14px rgba(60,10,10,0.22), inset 0 2px 4px rgba(255,255,255,0.35);
    display:inline-flex;align-items:center;justify-content:center;line-height:1;margin-top:2px;
  }
  .exportBtn:active{transform:translateY(1px);}

  .postcardModal{
    position:fixed;inset:0;z-index:40;background:rgba(20,12,10,0.72);
    display:none;align-items:center;justify-content:center;padding:4vh 4vw;
  }
  .postcardPanel{
    background:#fff;border-radius:18px;padding:26px 28px 30px;
    max-width:760px;width:100%;max-height:90vh;overflow:auto;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);
  }
  .postcardPanel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .postcardPanel h2{font-family:'Notable',sans-serif;font-weight:400;font-size:20px;margin:0;}
  .postcardClose{background:none;border:none;font-size:22px;line-height:1;cursor:pointer;opacity:0.5;padding:4px;}
  .postcardClose:hover{opacity:1;}
  .postcardHint{font-size:12.5px;opacity:0.55;margin:2px 0 18px;}
  .postcardGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .postcard-cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .postcard-thumb{width:100%;height:auto;border-radius:8px;cursor:pointer;border:1.5px solid rgba(0,0,0,0.1);transition:transform .15s ease, box-shadow .15s ease;}
  .postcard-thumb:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.18);}
  .postcard-label{font-weight:700;font-size:12px;opacity:0.7;}
  @media (max-width:560px){ .postcardGrid{grid-template-columns:1fr;} }
  .drag-hint{font-size:11px;opacity:0.45;margin-top:-6px;}

  .timeline-wrap{padding:6px 6vw 36px;}
  .timeline{position:relative;height:56px;}
  .track{position:absolute;top:28px;left:0;right:0;height:3px;background:rgba(0,0,0,0.12);border-radius:2px;}
  .trackFill{position:absolute;top:28px;left:0;height:3px;background:#c8102e;border-radius:2px;transition:width .25s ease;}
  .tick{position:absolute;top:21px;width:17px;height:17px;border-radius:50%;background:#fff;border:2.5px solid rgba(0,0,0,0.25);transform:translateX(-50%);cursor:pointer;transition:border-color .2s, background .2s, transform .2s;}
  .tick.active{background:#c8102e;border-color:#c8102e;transform:translateX(-50%) scale(1.25);}
  .tick-label{position:absolute;top:44px;transform:translateX(-50%);font-size:9.5px;font-weight:700;text-align:center;white-space:nowrap;opacity:0.55;}
  .tick-label.active{opacity:1;color:#c8102e;}
</style>

<body>
<div id="debugErr" style="position:fixed;top:60px;left:5vw;right:5vw;z-index:50;font:11px monospace;color:#b00020;background:rgba(255,255,255,0.95);border:1px solid #b00020;border-radius:8px;padding:8px;display:none;white-space:pre-wrap;max-height:30vh;overflow:auto;"></div>

<div class="topbar">
  <a class="back" href="naming.html">&larr; BACK</a>
  <div class="brandmark">APPLE NO.129</div>
</div>
<div class="kicker">Your apple's journey</div>
<div class="namebadge" id="nameBadge"></div>
<a class="gradingEntry" href="grading.html">ENTER GRADING SYSTEM &rarr;</a>

<div class="stage">
  <div class="era-head">
    <div class="era-year" id="eraYear">YEAR</div>
    <h1 class="era-title" id="eraTitle">Title</h1>
  </div>

  <div class="viewer" id="viewer">
    <img class="bg-painting" id="bgPainting" style="display:none;">
    <div class="bg-blank" id="bgBlank" style="display:none;"></div>
    <img class="apple-layer" id="appleLayer" draggable="false">
    <div class="resize-handle" id="resizeHandle"></div>
    <img class="apple-layer-fixed" id="appleLayerFixed" draggable="false">
  </div>

  <div class="story" id="eraStory">Story text.</div>
  <div class="callout" id="eraCallout"></div>
  <div class="drag-hint" id="dragHint">Drag your apple to move it &middot; drag the dot to resize</div>
  <button class="exportBtn" id="exportBtn">EXPORT POSTCARD</button>
  <button class="exportBtn" id="shareBtn">SHARE YOUR POSTCARD</button>
</div>

<div class="timeline-wrap">
  <div class="timeline" id="timeline">
    <div class="track"></div>
    <div class="trackFill" id="trackFill"></div>
  </div>
</div>

<div class="postcardModal" id="postcardModal">
  <div class="postcardPanel">
    <div class="postcardPanel-head">
      <h2>Choose a version</h2>
      <button class="postcardClose" id="postcardClose">&times;</button>
    </div>
    <div class="postcardHint" id="postcardHint">Click a version to save it to your device.</div>
    <div class="postcardGrid" id="postcardGrid"></div>
  </div>
</div>

<script>
function showErr(msg){
  const el = document.getElementById('debugErr');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}
window.addEventListener('error', e=> showErr('Error: ' + e.message));

const ERAS = [
  { id:'durer', year:'1507', title:"Dürer's Adam and Eve",
    story:"Dürer's life-sized panel paintings gave the forbidden fruit its most famous face: round, smooth, faintly golden-red. This single image did more than any sermon to fix “what the apple looked like” in Western art.",
    ready:true, bg:'assets/durer.jpg', bgPosition:'center top', slot:{ left:84, top:39, width:10 } },
  { id:'paris', year:'c.1635', title:'The Judgment of Paris',
    story:"Eris, goddess of discord, threw a golden apple inscribed “to the fairest” among three goddesses, starting the rivalry that led to the Trojan War. It was never a real apple — it was a prize, a symbol, a trigger for conflict.",
    ready:true, bg:'assets/paris.jpg', slot:{ left:43, top:41, width:13 } },
  { id:'newton', year:'1666 / 1726', title:"Newton's Apple",
    story:"Newton told people late in his life that watching an apple fall from a tree helped him think about gravity. The earliest written account, from 1726, says nothing about it hitting his head — that detail was invented more than a century later.",
    ready:true, bg:'assets/newton.jpg', slot:{ left:11, top:40, width:11 },
    fixedSlot:{ left:77.6, top:27.2, width:18.6, height:21.3 } },
  { id:'cezanne', year:'c.1890s', title:"Cézanne's Apples",
    story:"Cézanne painted apples obsessively for decades, deliberately refusing to make them look smooth or perfectly round. His loose, colour-built fruit argued — a century before any supermarket standard — against the idea that an apple should be judged by how closed and uniform its shape is.",
    ready:true, bg:'assets/cezanne.jpg', slot:{ left:58, top:46, width:14 } },
  { id:'bigapple', year:'1920s', title:'The Big Apple',
    story:"New York's nickname has nothing to do with real apples. It began as 1920s horse-racing slang, was picked up by jazz musicians in the 1930s, and became official tourism branding in the 1970s. By the 20th century, “apple” had become a word you could borrow — a symbol untethered from the fruit itself.",
    ready:true, bg:'assets/bigapple.jpg', slot:{ left:34, top:18, width:32 } }
];

const CALLOUTS = {
  paris:   (u,a)=> `What if the golden apple Paris handed to Aphrodite had looked exactly like ${a}?`,
  durer:   (u,a)=> `Dürer painted the forbidden fruit perfectly round — what if he'd painted ${a} instead?`,
  newton:  (u,a)=> `Oh my — the apple that fell on Newton's head turns out to have looked just like ${a}.`,
  cezanne: (u,a)=> `Cézanne spent decades painting apples that refused to be perfect. ${a} would have fit right on his table.`,
  bigapple:(u,a)=> `If New York had borrowed its nickname from a real apple, it might as well have been ${a}.`
};

const NEWSLEADS = {
  paris:   (u,a)=> `DISPATCH FROM MT. IDA — The golden apple at the centre of the gods' quarrel has been identified as ${a}, grown by ${u}.`,
  durer:   (u,a)=> `STUDIO NOTES, NUREMBERG — Albrecht Dürer has just sketched ${a}, an apple grown by ${u}, as the forbidden fruit of Eden.`,
  newton:  (u,a)=> `REPORTED TODAY — An apple grown by ${u}, named ${a}, has just fallen on Sir Isaac Newton's head.`,
  cezanne: (u,a)=> `FROM THE ATELIER, AIX-EN-PROVENCE — Paul Cézanne has set ${a}, an apple grown by ${u}, on his still-life table.`,
  bigapple:(u,a)=> `CITY DESK, NEW YORK — The nickname "The Big Apple" has just been pinned on ${a}, an apple grown by ${u}.`
};

let artwork = null;
try{ artwork = localStorage.getItem('apple129_artwork'); }catch(e){}

let userName = 'You', appleName = 'your apple';
try{
  userName = localStorage.getItem('apple129_username') || userName;
  appleName = localStorage.getItem('apple129_applename') || appleName;
}catch(e){}
document.getElementById('nameBadge').textContent = `Traveling with ${userName} · Apple ${appleName}`;

let current = 0;
const viewer = document.getElementById('viewer');
const timeline = document.getElementById('timeline');
const trackFill = document.getElementById('trackFill');
const bgPainting = document.getElementById('bgPainting');
const bgBlank = document.getElementById('bgBlank');
const appleLayer = document.getElementById('appleLayer');
const appleLayerFixed = document.getElementById('appleLayerFixed');
const resizeHandle = document.getElementById('resizeHandle');
const dragHint = document.getElementById('dragHint');

function buildTicks(){
  ERAS.forEach((era, i)=>{
    const pct = (i/(ERAS.length-1))*100;
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = pct+'%';
    tick.dataset.index = i;
    tick.addEventListener('click', ()=> goTo(i));
    timeline.appendChild(tick);

    const label = document.createElement('div');
    label.className = 'tick-label';
    label.style.left = pct+'%';
    label.textContent = era.year;
    label.dataset.index = i;
    timeline.appendChild(label);
  });
}
buildTicks();

function placeAppleLayer(slot){
  // slot values are percentages of the viewer box; width is % of viewer width,
  // height is derived from the image's own aspect ratio once it loads.
  appleLayer.style.left = slot.left + '%';
  appleLayer.style.top = slot.top + '%';
  appleLayer.style.width = slot.width + '%';
  appleLayer.style.height = 'auto';
  positionResizeHandle();
}

function positionResizeHandle(){
  const r = appleLayer.getBoundingClientRect();
  const vr = viewer.getBoundingClientRect();
  resizeHandle.style.left = (r.right - vr.left - 8) + 'px';
  resizeHandle.style.top = (r.bottom - vr.top - 8) + 'px';
}

function renderEra(i){
  const era = ERAS[i];
  document.getElementById('eraYear').textContent = era.year;
  document.getElementById('eraTitle').textContent = era.title;

  document.querySelectorAll('.tick').forEach(t=> t.classList.toggle('active', +t.dataset.index === i));
  document.querySelectorAll('.tick-label').forEach(t=> t.classList.toggle('active', +t.dataset.index === i));
  trackFill.style.width = ((i/(ERAS.length-1))*100)+'%';

  bgPainting.style.display = 'none';
  bgBlank.style.display = 'none';
  appleLayer.style.display = 'none';
  resizeHandle.style.display = 'none';
  dragHint.style.display = 'none';
  appleLayerFixed.style.display = 'none';

  const storyEl = document.getElementById('eraStory');
  const calloutEl = document.getElementById('eraCallout');

  if(era.bg){
    bgPainting.src = era.bg;
    bgPainting.style.display = 'block';
    bgPainting.style.objectPosition = era.bgPosition || 'center center';
    bgPainting.onerror = ()=> showErr('could not load image: ' + era.bg);
  } else {
    bgBlank.style.display = 'block';
  }
  storyEl.style.display = 'block';
  storyEl.textContent = era.ready ? era.story : 'An introduction for this stop will be added here.';

  const calloutFn = CALLOUTS[era.id];
  calloutEl.textContent = calloutFn ? calloutFn(userName, appleName) : '';

  const slot = era.slot || { left:38, top:30, width:24 };
  if(artwork){
    appleLayer.onload = ()=>{ placeAppleLayer(slot); };
    appleLayer.src = artwork;
    appleLayer.style.display = 'block';
    resizeHandle.style.display = 'block';
    dragHint.style.display = 'block';
    placeAppleLayer(slot);
  }

  if(era.fixedSlot && artwork){
    const fs = era.fixedSlot;
    appleLayerFixed.src = artwork;
    appleLayerFixed.style.left = fs.left + '%';
    appleLayerFixed.style.top = fs.top + '%';
    appleLayerFixed.style.width = fs.width + '%';
    appleLayerFixed.style.height = fs.height + '%';
    appleLayerFixed.style.display = 'block';
  }
}

function goTo(i){
  current = Math.max(0, Math.min(ERAS.length-1, i));
  renderEra(current);
}

/* ---------- timeline scrubbing ---------- */
let scrubbing = false;
function posToIndex(clientX){
  const r = timeline.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return Math.round(pct * (ERAS.length-1));
}
timeline.addEventListener('pointerdown', e=>{
  scrubbing = true;
  timeline.setPointerCapture(e.pointerId);
  goTo(posToIndex(e.clientX));
});
timeline.addEventListener('pointermove', e=>{ if(scrubbing) goTo(posToIndex(e.clientX)); });
timeline.addEventListener('pointerup', ()=> scrubbing=false);
timeline.addEventListener('pointercancel', ()=> scrubbing=false);

/* ---------- drag the apple layer to reposition ---------- */
let dragState = null;
appleLayer.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  const vr = viewer.getBoundingClientRect();
  dragState = {
    startX: e.clientX, startY: e.clientY,
    origLeftPct: parseFloat(appleLayer.style.left),
    origTopPct: parseFloat(appleLayer.style.top),
    vrW: vr.width, vrH: vr.height
  };
  appleLayer.classList.add('grabbing');
  appleLayer.setPointerCapture(e.pointerId);
});
appleLayer.addEventListener('pointermove', e=>{
  if(!dragState) return;
  const dxPct = (e.clientX - dragState.startX) / dragState.vrW * 100;
  const dyPct = (e.clientY - dragState.startY) / dragState.vrH * 100;
  appleLayer.style.left = (dragState.origLeftPct + dxPct) + '%';
  appleLayer.style.top = (dragState.origTopPct + dyPct) + '%';
  positionResizeHandle();
});
appleLayer.addEventListener('pointerup', ()=>{ dragState=null; appleLayer.classList.remove('grabbing'); });
appleLayer.addEventListener('pointercancel', ()=>{ dragState=null; appleLayer.classList.remove('grabbing'); });

/* ---------- drag the handle to resize ---------- */
let resizeState = null;
resizeHandle.addEventListener('pointerdown', e=>{
  e.stopPropagation();
  const vr = viewer.getBoundingClientRect();
  resizeState = {
    startX: e.clientX,
    origWidthPct: parseFloat(appleLayer.style.width),
    vrW: vr.width
  };
  resizeHandle.setPointerCapture(e.pointerId);
});
resizeHandle.addEventListener('pointermove', e=>{
  if(!resizeState) return;
  const dPct = (e.clientX - resizeState.startX) / resizeState.vrW * 100;
  let w = resizeState.origWidthPct + dPct;
  w = Math.max(4, Math.min(60, w));
  appleLayer.style.width = w + '%';
  positionResizeHandle();
});
resizeHandle.addEventListener('pointerup', ()=> resizeState=null);
resizeHandle.addEventListener('pointercancel', ()=> resizeState=null);

/* mouse wheel also resizes, for convenience on desktop */
appleLayer.addEventListener('wheel', e=>{
  e.preventDefault();
  let w = parseFloat(appleLayer.style.width);
  w *= (e.deltaY < 0 ? 1.07 : 0.93);
  w = Math.max(4, Math.min(60, w));
  appleLayer.style.width = w + '%';
  positionResizeHandle();
}, { passive:false });

window.addEventListener('resize', ()=> positionResizeHandle());

/* ---------- postcard export: 4 selectable templates ---------- */
function drawCover(ctx, img, dx, dy, dw, dh, posY){
  posY = posY === undefined ? 0.5 : posY;
  const ir = img.naturalWidth / img.naturalHeight;
  const dr = dw / dh;
  let sx, sy, sw, sh;
  if(ir > dr){
    sh = img.naturalHeight; sw = sh * dr;
    sx = (img.naturalWidth - sw) / 2; sy = 0;
  } else {
    sw = img.naturalWidth; sh = sw / dr;
    sx = 0; sy = (img.naturalHeight - sh) * posY;
  }
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}

function bgPosYFromEra(era){
  const p = era.bgPosition || '';
  if(p.indexOf('top') !== -1) return 0;
  if(p.indexOf('bottom') !== -1) return 1;
  return 0.5;
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight, align){
  const words = text.split(' ');
  let line = '', yy = y;
  for(let n = 0; n < words.length; n++){
    const testLine = line + words[n] + ' ';
    if(ctx.measureText(testLine).width > maxWidth && n > 0){
      drawLine(line, yy);
      line = words[n] + ' ';
      yy += lineHeight;
    } else {
      line = testLine;
    }
  }
  drawLine(line, yy);
  return yy + lineHeight;

  function drawLine(ln, ly){
    const tx = align === 'left' ? x : x + maxWidth/2;
    ctx.textAlign = align === 'left' ? 'left' : 'center';
    ctx.fillText(ln.trim(), tx, ly);
  }
}

/* composites the painting + the user's apple into an arbitrary rect (must stay 4:3 to match the on-page slot percentages) */
function compositeArtwork(ctx, era, dx, dy, dw, dh){
  if(era.bg && bgPainting.complete && bgPainting.naturalWidth){
    drawCover(ctx, bgPainting, dx, dy, dw, dh, bgPosYFromEra(era));
    ctx.fillStyle = 'rgba(90,60,30,0.07)';
    ctx.fillRect(dx, dy, dw, dh);
  } else {
    ctx.fillStyle = '#f3ece7';
    ctx.fillRect(dx, dy, dw, dh);
  }
  if(artwork && appleLayer.complete && appleLayer.naturalWidth){
    const slot = era.slot || { left:38, top:30, width:24 };
    const leftPct = parseFloat(appleLayer.style.left) || slot.left;
    const topPct = parseFloat(appleLayer.style.top) || slot.top;
    const widthPct = parseFloat(appleLayer.style.width) || slot.width;
    const aw = (widthPct/100) * dw;
    const ah = aw * (appleLayer.naturalHeight / appleLayer.naturalWidth);
    const ax = dx + (leftPct/100) * dw;
    const ay = dy + (topPct/100) * dh;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = dw * 0.022;
    ctx.shadowOffsetY = dw * 0.012;
    ctx.drawImage(appleLayer, ax, ay, aw, ah);
    ctx.restore();
  }
  if(era.fixedSlot && artwork && appleLayer.complete && appleLayer.naturalWidth){
    const fs = era.fixedSlot;
    const fx = dx + (fs.left/100) * dw;
    const fy = dy + (fs.top/100) * dh;
    const fw = (fs.width/100) * dw;
    const fh = (fs.height/100) * dh;
    const ar = appleLayer.naturalWidth / appleLayer.naturalHeight;
    let cw = fw, ch = fw / ar;
    if(ch > fh){ ch = fh; cw = fh * ar; }
    const cx = fx + (fw - cw)/2;
    const cy = fy + (fh - ch)/2;
    ctx.save();
    ctx.filter = 'grayscale(1)';
    ctx.drawImage(appleLayer, cx, cy, cw, ch);
    ctx.restore();
  }
}

const HEADLINES = {
  paris:   'GOLDEN APPLE IDENTIFIED',
  durer:   'DÜRER PAINTS THE FRUIT',
  newton:  'APPLE STRIKES NEWTON',
  cezanne: 'CÉZANNE’S TABLE REVEALED',
  bigapple:'CITY STEALS APPLE’S NAME'
};

const FRAME_FRAC = { left:0.1135, right:0.8843, top:0.0899, bottom:0.9062 };
const frameImg = new Image();
frameImg.src = 'assets/museum-frame.png';

function ensureFontsReady(){
  if(!document.fonts) return Promise.resolve();
  return Promise.all([
    document.fonts.load('700 34px Caveat'),
    document.fonts.load('400 22px Caveat')
  ]).catch(()=>{});
}
function ensureFrameReady(){
  if(frameImg.complete) return Promise.resolve();
  return new Promise(res=>{ frameImg.onload = res; frameImg.onerror = res; });
}

/* ---- Template 1: vintage stamped postcard, handwritten note ---- */
function drawPostcardVintage(ctx, W, H, era){
  ctx.fillStyle = '#f3ece0';
  ctx.fillRect(0, 0, W, H);

  const pad = 34;
  const imgW = W - pad*2, imgH = imgW * 0.75;
  compositeArtwork(ctx, era, pad, pad, imgW, imgH);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.strokeRect(pad, pad, imgW, imgH);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1; ctx.strokeRect(pad, pad, imgW, imgH);

  let y = pad + imgH + 26;
  ctx.setLineDash([3,4]);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
  ctx.setLineDash([]);

  /* postmark stamp, sitting in the written card like a real postcard */
  const pmX = W - pad - 46, pmY = y + 46, pmR = 36;
  ctx.save();
  ctx.translate(pmX, pmY);
  ctx.rotate(-0.15);
  ctx.strokeStyle = 'rgba(178,58,58,0.65)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, pmR, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, pmR-6, 0, Math.PI*2); ctx.stroke();
  ctx.font = 'bold 10px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(178,58,58,0.75)';
  ctx.fillText('APPLE NO.129', 0, -5);
  ctx.fillText(era.year.toUpperCase(), 0, 9);
  for(let i=0;i<5;i++){
    const a0 = (i/5) * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0)*(pmR+4), Math.sin(a0)*(pmR+4));
    ctx.lineTo(Math.cos(a0)*(pmR+13), Math.sin(a0)*(pmR+13));
    ctx.stroke();
  }
  ctx.restore();

  /* handwritten date, top-left of the card */
  ctx.save();
  ctx.translate(pad + 10, y + 34);
  ctx.rotate(-0.03);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#7a5a3a';
  ctx.font = '400 22px Caveat, cursive';
  ctx.fillText(era.year, 0, 0);
  ctx.restore();

  /* handwritten message */
  const leadFn = CALLOUTS[era.id];
  const lead = leadFn ? leadFn(userName, appleName) : era.title;
  ctx.fillStyle = '#5a3b28';
  ctx.font = '700 32px Caveat, cursive';
  let my = wrapText(ctx, lead, pad, y + 94, W - pad*2, 38, 'center');

  my += 10;
  ctx.fillStyle = '#4a3f38';
  ctx.font = '13.5px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText(era.title + ' — ' + era.year, W/2, my);

  ctx.fillStyle = '#8a7a6f';
  ctx.font = '11px Georgia, serif';
  ctx.fillText(('APPLE ' + appleName + ' · GROWN BY ' + userName).toUpperCase(), W/2, H - 28);
}

/* ---- Template 2: blurred backdrop + polaroid photo + handwritten keepsake card ---- */
function drawPostcardPolaroid(ctx, W, H, era){
  ctx.save();
  ctx.filter = 'blur(18px) saturate(0.75)';
  compositeArtwork(ctx, era, -30, -30, W+60, H+60);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.58)';
  ctx.fillRect(0, 0, W, H);

  const photoW = 400, photoH = 300, bSide = 14, bBottom = 54;
  const cardW = photoW + bSide*2, cardH = photoH + bSide + bBottom;
  const cx = W/2, cardX = (W-cardW)/2, cardY = 54;
  ctx.save();
  ctx.translate(cx, cardY + cardH/2);
  ctx.rotate(-0.035);
  ctx.translate(-cx, -(cardY + cardH/2));
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#fff';
  ctx.fillRect(cardX, cardY, cardW, cardH);
  ctx.shadowColor = 'transparent';
  compositeArtwork(ctx, era, cardX + bSide, cardY + bSide, photoW, photoH);
  ctx.restore();

  const noteY = cardY + cardH + 44, noteH = 270, noteW = 560, noteX = (W-noteW)/2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#fdfbf6';
  ctx.fillRect(noteX, noteY, noteW, noteH);
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
  ctx.strokeRect(noteX, noteY, noteW, noteH);

  const leadFn = CALLOUTS[era.id];
  const lead = leadFn ? leadFn(userName, appleName) : era.title;
  ctx.fillStyle = '#5a3b28';
  ctx.font = '700 30px Caveat, cursive';
  let ny = wrapText(ctx, lead, noteX + 26, noteY + 48, noteW - 52, 36, 'center');

  ny += 14;
  ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(noteX+40, ny); ctx.lineTo(noteX+noteW-40, ny); ctx.stroke();
  ny += 24;

  ctx.fillStyle = '#6b5d52';
  ctx.font = '700 11px "Courier New", monospace';
  ctx.textAlign = 'center';
  ctx.fillText((era.title + '  ·  ' + era.year).toUpperCase(), W/2, ny);

  ctx.fillStyle = '#9a8c80';
  ctx.font = '700 10px "Courier New", monospace';
  ctx.fillText(('APPLE ' + appleName + '  ·  GROWN BY ' + userName).toUpperCase(), W/2, H - 26);
}

/* ---- Template 3: newspaper front page, masthead + banner headline ---- */
function drawGazette(ctx, W, H, era){
  const pad = 40;
  ctx.fillStyle = '#f6efe6';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#1b1210'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, 36); ctx.lineTo(W-pad, 36); ctx.stroke();
  ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(pad, 41); ctx.lineTo(W-pad, 41); ctx.stroke();

  ctx.font = 'bold 11px Georgia, serif';
  ctx.fillStyle = '#6b5d52';
  ctx.textAlign = 'left';
  ctx.fillText(era.year.toUpperCase(), pad, 60);
  ctx.textAlign = 'right';
  ctx.fillText('APPLE NO.129', W-pad, 60);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#1b1210';
  ctx.font = 'bold 32px Georgia, "Times New Roman", serif';
  ctx.fillText('THE APPLE GAZETTE', W/2, 96);

  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(pad, 112); ctx.lineTo(W-pad, 112); ctx.stroke();
  ctx.lineWidth = 0.75;
  ctx.beginPath(); ctx.moveTo(pad, 117); ctx.lineTo(W-pad, 117); ctx.stroke();

  const headline = HEADLINES[era.id] || era.title.toUpperCase();
  ctx.fillStyle = '#15100e';
  ctx.font = '900 46px "Arial Black", Impact, sans-serif';
  let y = wrapText(ctx, headline, pad, 172, W - pad*2, 50, 'center');

  y += 8;
  const leadFn = NEWSLEADS[era.id];
  const lead = leadFn ? leadFn(userName, appleName) : '';
  ctx.fillStyle = '#2a2320';
  ctx.font = 'italic 15px Georgia, "Times New Roman", serif';
  y = wrapText(ctx, lead, pad + 20, y + 28, W - pad*2 - 40, 21, 'center');

  y += 14;
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
  y += 26;

  const imgW = 460, imgH = imgW * 0.75, imgX = (W - imgW)/2;
  compositeArtwork(ctx, era, imgX, y, imgW, imgH);
  ctx.strokeStyle = '#1b1210'; ctx.lineWidth = 2;
  ctx.strokeRect(imgX, y, imgW, imgH);

  y += imgH + 18;
  ctx.fillStyle = '#6b5d52';
  ctx.font = 'italic 11px Georgia, serif';
  ctx.fillText(era.title, W/2, y);

  y += 26;
  ctx.fillStyle = '#231c19';
  ctx.font = '14.5px Georgia, "Times New Roman", serif';
  y = wrapText(ctx, era.story, 70, y, W - 140, 21, 'left');

  y += 16;
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W-pad, y); ctx.stroke();
  y += 26;

  ctx.fillStyle = '#8a7a6f';
  ctx.font = 'bold 10px Georgia, "Times New Roman", serif';
  ctx.fillText((era.year + '  ·  APPLE ' + appleName + '  ·  GROWN BY ' + userName).toUpperCase(), W/2, y);

  return y + 30;
}

/* ---- Template 4: museum wall frame using the uploaded ornate gold frame ---- */
function drawMuseumFrame(ctx, W, H, era){
  const wall = ctx.createLinearGradient(0, 0, 0, H);
  wall.addColorStop(0, '#2f2823');
  wall.addColorStop(1, '#1c1714');
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W/2, H*0.3, W*0.15, W/2, H*0.3, W*0.8);
  vg.addColorStop(0, 'rgba(255,255,255,0.05)');
  vg.addColorStop(1, 'rgba(0,0,0,0.2)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  const marginX = 50, frameY = 40;
  const frameW = W - marginX*2;
  const frameAR = (frameImg.naturalWidth && frameImg.naturalHeight) ? (frameImg.naturalHeight/frameImg.naturalWidth) : 1.26;
  const frameH = frameW * frameAR;
  const frameX = marginX;

  const ix = frameX + FRAME_FRAC.left*frameW;
  const iy = frameY + FRAME_FRAC.top*frameH;
  const iw = (FRAME_FRAC.right - FRAME_FRAC.left) * frameW;
  const ih = (FRAME_FRAC.bottom - FRAME_FRAC.top) * frameH;

  ctx.fillStyle = '#0c0a09';
  ctx.fillRect(ix, iy, iw, ih);
  compositeArtwork(ctx, era, ix, iy, iw, ih);

  if(frameImg.complete && frameImg.naturalWidth){
    ctx.drawImage(frameImg, frameX, frameY, frameW, frameH);
  }

  const plaqueY = frameY + frameH + 24, plaqueH = 140, plaqueW = frameW, plaqueX = frameX;
  ctx.fillStyle = '#1a1512';
  ctx.fillRect(plaqueX, plaqueY, plaqueW, plaqueH);
  ctx.strokeStyle = '#caa149'; ctx.lineWidth = 1.5;
  ctx.strokeRect(plaqueX+4, plaqueY+4, plaqueW-8, plaqueH-8);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#f0e6d2';
  ctx.font = '600 20px Georgia, "Times New Roman", serif';
  ctx.fillText(era.title, W/2, plaqueY + 42);

  ctx.font = 'italic 13px Georgia, serif';
  ctx.fillStyle = '#caa149';
  ctx.fillText('Apple No.129 Collection · ' + era.year, W/2, plaqueY + 68);

  ctx.font = '11px Georgia, serif';
  ctx.fillStyle = 'rgba(240,230,210,0.72)';
  ctx.fillText(('Grown by ' + userName + ' · named ' + appleName).toUpperCase(), W/2, plaqueY + 94);

  return plaqueY + plaqueH + 30;
}

function drawPlainPhoto(ctx, W, H, era){
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  const border = 40;
  const imgW = W - border*2, imgH = imgW * 0.75;
  compositeArtwork(ctx, era, border, border, imgW, imgH);
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.strokeRect(border, border, imgW, imgH);
}

const POSTCARD_TEMPLATES = [
  { id:'plain-photo',       label:'Just the photo',      w:700, h:545,  draw:drawPlainPhoto },
  { id:'postcard-vintage',  label:'Postcard — Vintage',  w:700, h:860,  draw:drawPostcardVintage },
  { id:'postcard-polaroid', label:'Postcard — Keepsake', w:700, h:850,  draw:drawPostcardPolaroid },
  { id:'gazette',           label:'Newspaper clipping',   w:700, h:1500, draw:drawGazette, trim:true },
  { id:'museum-frame',      label:'Museum frame',         w:700, h:1100, draw:drawMuseumFrame, trim:true }
];

function buildPostcardCanvas(era, tpl){
  const canvas = document.createElement('canvas');
  canvas.width = tpl.w;
  canvas.height = tpl.h;
  const ctx = canvas.getContext('2d');
  const usedH = tpl.draw(ctx, tpl.w, tpl.h, era);
  if(tpl.trim && usedH){
    const trimmed = document.createElement('canvas');
    trimmed.width = tpl.w;
    trimmed.height = Math.ceil(usedH);
    trimmed.getContext('2d').drawImage(canvas, 0, 0);
    return trimmed;
  }
  return canvas;
}

function downloadCanvas(canvas, era, tplId){
  const link = document.createElement('a');
  link.download = 'apple129-' + era.id + '-' + tplId + '.png';
  link.href = canvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function shareCanvas(canvas){
  try{
    localStorage.setItem('apple129_share_draft', canvas.toDataURL('image/png'));
  }catch(e){ showErr('share failed: ' + e.message); return; }
  window.location.href = 'forum.html';
}

async function openPostcardModal(mode){
  await Promise.all([ensureFontsReady(), ensureFrameReady()]);
  const era = ERAS[current];
  const grid = document.getElementById('postcardGrid');
  grid.innerHTML = '';
  document.getElementById('postcardHint').textContent = mode === 'share'
    ? 'Click a version to share it to the Orchard Board.'
    : 'Click a version to save it to your device.';
  POSTCARD_TEMPLATES.forEach(tpl=>{
    const canvas = buildPostcardCanvas(era, tpl);
    canvas.className = 'postcard-thumb';
    canvas.title = mode === 'share' ? 'Click to share this version' : 'Click to save this version';
    canvas.addEventListener('click', ()=>{
      if(mode === 'share') shareCanvas(canvas);
      else downloadCanvas(canvas, era, tpl.id);
    });

    const label = document.createElement('div');
    label.className = 'postcard-label';
    label.textContent = tpl.label;

    const cell = document.createElement('div');
    cell.className = 'postcard-cell';
    cell.appendChild(canvas);
    cell.appendChild(label);
    grid.appendChild(cell);
  });
  document.getElementById('postcardModal').style.display = 'flex';
}

function closePostcardModal(){
  document.getElementById('postcardModal').style.display = 'none';
}

document.getElementById('exportBtn').addEventListener('click', ()=>{
  openPostcardModal('download').catch(e=> showErr('export failed: ' + e.message));
});
document.getElementById('shareBtn').addEventListener('click', ()=>{
  openPostcardModal('share').catch(e=> showErr('share failed: ' + e.message));
});
document.getElementById('postcardClose').addEventListener('click', closePostcardModal);
document.getElementById('postcardModal').addEventListener('click', e=>{
  if(e.target.id === 'postcardModal') closePostcardModal();
});

renderEra(current);
</script>
